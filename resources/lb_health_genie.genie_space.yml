# Genie space over the lb_health_check views.
#
# The serialized space is inline (YAML/JSON) rather than in genie/*.geniespace.json because DAB
# inlines file_path contents verbatim — ${var.*} inside the file would not be interpolated, and the
# table identifiers must be fully qualified with the deployment's catalog and schema.
# To round-trip edits made in the Genie UI:  databricks bundle generate genie-space --resource lb_health_genie
# then re-apply the ${var.target_catalog_name}.${var.target_schema_name} prefixes.
resources:
  genie_spaces:
    lb_health_genie:
      title: "Lakebase Health Investigator"
      description: "Ask about Lakebase connection, CPU, cache, bloat, sequential scan and index health trends."
      warehouse_id: ${var.warehouse_id}
      serialized_space:
        {
          "version": 2,
          "config": {
            "sample_questions": [
              {
                "id": "a0000000000000000000000000000001",
                "question": [
                  "Which trends are red this period?"
                ]
              },
              {
                "id": "a0000000000000000000000000000002",
                "question": [
                  "Show CPU p95 by hour for the last 7 days"
                ]
              },
              {
                "id": "a0000000000000000000000000000003",
                "question": [
                  "Which large tables are being sequentially scanned the most?"
                ]
              },
              {
                "id": "a0000000000000000000000000000004",
                "question": [
                  "List unused indexes bigger than 50 MB"
                ]
              },
              {
                "id": "a0000000000000000000000000000005",
                "question": [
                  "Did bloat on any table grow more than 10 points in two weeks?"
                ]
              },
              {
                "id": "a0000000000000000000000000000006",
                "question": [
                  "When was the last autovacuum on the tables with the most dead rows?"
                ]
              }
            ]
          },
          "data_sources": {
            "tables": [
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_daily",
                "description": [
                  "One row per endpoint per UTC day with trend values t1..t11 as columns. Use for trends and comparisons across days."
                ]
              },
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_hourly",
                "description": [
                  "One row per endpoint per UTC hour with runtime metrics (connections, idle-in-transaction, CPU, cache). Use for intraday questions."
                ]
              },
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_index_findings",
                "description": [
                  "Flagged indexes per day: finding = invalid | unused | duplicate."
                ]
              },
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_objects_latest",
                "description": [
                  "Current state of every table and index from the latest Postgres snapshot (rows, dead rows, scans, size, bloat, autovacuum)."
                ]
              },
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_review_summary",
                "description": [
                  "Status (red/amber/green/info/unknown/not_available) per health trend (trend_name) per endpoint per period_days (7, 14)."
                ]
              },
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_seq_scan_queries",
                "description": [
                  "Queries that sequentially scanned a large table, per day, with query text and whether the query is new."
                ]
              },
              {
                "identifier": "${var.target_catalog_name}.${var.target_schema_name}.lb_health_thresholds",
                "description": [
                  "Reference value per health trend (threshold_id T1..T11; metric = the trend column in lb_health_daily; reference_type; direction)."
                ]
              }
            ]
          },
          "instructions": {
            "text_instructions": [
              {
                "id": "b0000000000000000000000000000007",
                "content": [
                  "You answer questions about the health of Lakebase (Postgres) endpoints using the Lakebase Health Check tables.\n",
                  "Which table to use: lb_health_hourly for intraday / hour-level questions; lb_health_daily for day-level trends; lb_health_review_summary for status (red/amber/green) of trends; lb_health_objects_latest for the current state of tables and indexes; lb_health_index_findings for invalid/unused/duplicate indexes; lb_health_seq_scan_queries for queries doing sequential scans. Never query system.lakebase or lb_health_metrics directly.\n",
                  "Keys: project_id, branch_id, endpoint_id identify an endpoint. endpoint_type = read_write is the primary, read_only is a read replica; replicas keep their own independent scan counters, so do not add primary and replica scan counts unless asked for the branch total.\n",
                  "object_name is schema.table for tables and schema.index for indexes. table_name in lb_health_objects_latest is schema.table.\n",
                  "Units: ratios and utilizations are fractions (0.70 = 70%): conn_util_*, cpu_util_*, cpu_busiest_core_max, idle_in_txn_share, lfc_hit_rate, lfc_working_set_fit, and the daily columns t1_conn_util_busiest_hour, t3_idle_in_txn_share, t4_cpu_util_busiest_hour, t6_cache_hit_rate, t7_working_set_fit. Bloat is in percent (bloat_pct 30 = 30%), including t8_max_bloat_pct. Bytes columns (bloat_bytes, index_bytes, real_size, lfc_working_set_60m_max, lfc_size_limit_min) are bytes. *_ms columns are milliseconds. All timestamps and days are UTC.\n",
                  "Hourly metrics: conn_count_avg (avg connections), conn_util_p95 / conn_util_max (connections / max_connections), max_connections_min, idle_in_txn_time_ms, session_time_ms, idle_in_txn_share (idle-in-transaction time / session time), idle_in_txn_max_age_ms, idle_in_txn_over_60s_count, idle_in_txn_over_300s_count (distinct idle-in-transaction sessions older than 60 s / 300 s), cpu_util_avg, cpu_util_p95, cpu_util_max, cpu_busiest_core_max, host_logical_cpus_max, cpu_per_connection (daily value is empty on days averaging under 1 connection), lfc_hits, lfc_misses, lfc_hit_rate (local file cache only, the second cache tier: it only sees reads that missed shared buffers, so it can be near 0 on a healthy endpoint), shared_blks_hit, shared_blks_read, cache_hit_rate (overall: (shared_blks_hit + lfc_hits) / (shared_blks_hit + shared_blks_read); use this for 'cache hit rate' questions), lfc_working_set_60m_max, lfc_size_limit_min, lfc_working_set_fit (working set / cache size).\n",
                  "Daily health trends (column in lb_health_daily = name): t1_conn_util_busiest_hour = Connection utilization (busiest hour); t2_idle_in_txn_over_60s_count = Long idle-in-transaction sessions; t3_idle_in_txn_share = Idle-in-transaction time share; t4_cpu_util_busiest_hour = CPU utilization (busiest hour); t5_cpu_per_connection = CPU per connection; t6_cache_hit_rate = Cache hit rate (overall buffer hit rate: shared buffers plus the local file cache); t7_working_set_fit = Working set vs. cache size; t8_max_bloat_pct = Table and index bloat; t9_dead_rows_large_tables = Dead rows on large tables; t10_seq_scan_ratio_large_tables = Full scans of large tables (full-table-scan equivalents per day); t11_new_seq_scan_queries = New sequential-scan queries (NULL with t11_status = not_available when query text is masked).\n",
                  "When answering, always refer to a trend by its name (trend_name in lb_health_review_summary, or the names above), never by its internal threshold_id or trend_id code.\n",
                  "Idle vs idle in transaction: an idle connection has no open transaction and is harmless (that is what a connection pool looks like). Idle in transaction means BEGIN was issued but not committed or rolled back while the backend runs nothing; it holds locks and blocks vacuum. Only idle-in-transaction is measured.\n",
                  "Thresholds: compare a trend to lb_health_thresholds by joining lb_health_thresholds.metric to the trend column name. direction = above_is_bad means value > value_line is a breach; below_is_bad means value < line. reference_type: static uses value (a value of 0 means any value above 0 is a breach); prior_period_avg (CPU per connection) compares with the average of the prior period; none (Dead rows on large tables) has no line, look for steady growth. Large table = n_live_tup >= 100000.\n",
                  "For status questions use lb_health_review_summary filtered on period_days = 14 unless the user asks for the 7-day period. Order by status_rank (0 = red first).\n"
                ]
              }
            ],
            "example_question_sqls": [
              {
                "id": "c0000000000000000000000000000008",
                "question": [
                  "Which trends are red this period?"
                ],
                "sql": [
                  "SELECT trend_name, endpoint_id, latest_value, reference_value, latest_day, days_breached FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_review_summary WHERE period_days = 14 AND status = 'red' ORDER BY trend_name, endpoint_id"
                ]
              },
              {
                "id": "c0000000000000000000000000000009",
                "question": [
                  "What is the latest status of every trend?"
                ],
                "sql": [
                  "SELECT trend_name, endpoint_id, status, latest_value, reference_value, avg_period, avg_prior, pct_change FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_review_summary WHERE period_days = 14 ORDER BY status_rank, trend_name"
                ]
              },
              {
                "id": "c000000000000000000000000000000a",
                "question": [
                  "How many days did each trend breach its reference line in the last 14 days?"
                ],
                "sql": [
                  "SELECT trend_name, endpoint_id, days_breached, days_with_data, status FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_review_summary WHERE period_days = 14 ORDER BY days_breached DESC, trend_name"
                ]
              },
              {
                "id": "c000000000000000000000000000000b",
                "question": [
                  "What was the busiest hour for connections each day?"
                ],
                "sql": [
                  "SELECT day, endpoint_id, max_by(hour_ts, conn_util_p95) AS busiest_hour, max(conn_util_p95) AS conn_util_p95 FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_hourly GROUP BY day, endpoint_id ORDER BY day DESC, endpoint_id"
                ]
              },
              {
                "id": "c000000000000000000000000000000c",
                "question": [
                  "Which hours had CPU p95 above 70%?"
                ],
                "sql": [
                  "SELECT hour_ts, endpoint_id, cpu_util_p95, cpu_util_avg, conn_count_avg FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_hourly WHERE cpu_util_p95 > 0.7 ORDER BY hour_ts DESC"
                ]
              },
              {
                "id": "c000000000000000000000000000000d",
                "question": [
                  "Show idle-in-transaction counts by hour"
                ],
                "sql": [
                  "SELECT hour_ts, endpoint_id, idle_in_txn_over_60s_count, idle_in_txn_over_300s_count, idle_in_txn_max_age_ms, idle_in_txn_share FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_hourly WHERE hour_ts >= current_timestamp() - INTERVAL 7 DAYS ORDER BY hour_ts DESC"
                ]
              },
              {
                "id": "c000000000000000000000000000000e",
                "question": [
                  "Which tables had the most sequential scans in the last 7 days?"
                ],
                "sql": [
                  "SELECT endpoint_id, datname, object_name, n_live_tup, seq_scan_7d FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_objects_latest WHERE object_type = 'table' ORDER BY seq_scan_7d DESC NULLS LAST LIMIT 20"
                ]
              },
              {
                "id": "c000000000000000000000000000000f",
                "question": [
                  "List unused indexes with their size"
                ],
                "sql": [
                  "SELECT endpoint_id, datname, object_name, table_name, finding, index_bytes / 1048576.0 AS index_mb, observed_days, indexdef FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_index_findings WHERE finding = 'unused' AND day = (SELECT max(day) FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_index_findings) ORDER BY index_bytes DESC"
                ]
              },
              {
                "id": "c0000000000000000000000000000010",
                "question": [
                  "What are the 10 most bloated tables and indexes?"
                ],
                "sql": [
                  "SELECT endpoint_id, datname, object_type, object_name, bloat_pct, bloat_bytes / 1048576.0 AS bloat_mb, real_size / 1048576.0 AS size_mb FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_objects_latest WHERE bloat_bytes IS NOT NULL AND coalesce(bloat_is_na, 0) = 0 ORDER BY bloat_bytes DESC LIMIT 10"
                ]
              },
              {
                "id": "c0000000000000000000000000000011",
                "question": [
                  "Which large tables are being sequentially scanned the most?"
                ],
                "sql": [
                  "SELECT o.endpoint_id, o.datname, o.object_name, o.n_live_tup, o.seq_scan_7d FROM ${var.target_catalog_name}.${var.target_schema_name}.lb_health_objects_latest o WHERE o.object_type = 'table' AND o.n_live_tup >= 100000 ORDER BY o.seq_scan_7d DESC NULLS LAST LIMIT 20"
                ]
              }
            ]
          }
        }
