resources:
  jobs:
    lakebase_health:
      name: lakebase_health
      description: >-
        Rolls system.lakebase telemetry up to hourly values, snapshots Postgres statistics views,
        computes daily health trends and enforces retention. See README.md.
      max_concurrent_runs: 1
      timeout_seconds: 3600

      schedule:
        quartz_cron_expression: "0 0 */4 * * ?"   # every 4 hours, UTC; every run does the same work
        timezone_id: UTC
        # Explicit, so it survives `mode: development`; the dev target sets PAUSED.
        pause_status: ${var.schedule_pause_status}

      email_notifications:
        on_failure: ${var.failure_notification_emails}

      parameters:
        - name: project_id
          default: ${var.project_id}
        - name: branch_id
          default: ${var.branch_id}
        - name: target_catalog_name
          default: ${var.target_catalog_name}
        - name: target_schema_name
          default: ${var.target_schema_name}

      # All tasks are notebook tasks on serverless job compute (no cluster / warehouse).
      # The only extra dependency, psycopg[binary], is %pip-installed inside the notebooks that
      # connect to Postgres (serverless notebook tasks take their environment from the notebook).
      # The preinstalled databricks-sdk is used as-is: upgrading it in-notebook caused a native
      # crash (SIGABRT) next to Spark Connect in dev, and the Lakebase calls go through REST anyway.
      tasks:
        - task_key: resolve_scope
          notebook_task:
            base_parameters: {run_id: "{{job.run_id}}"}   # stamped on every row
            notebook_path: ../src/00_resolve_scope.py

        - task_key: system_tables_rollup
          depends_on:
            - task_key: resolve_scope
          notebook_task:
            base_parameters: {run_id: "{{job.run_id}}"}   # stamped on every row
            notebook_path: ../src/02_system_tables_rollup.py

        - task_key: postgres_snapshot
          depends_on:
            - task_key: resolve_scope
          max_retries: 1
          min_retry_interval_millis: 60000
          notebook_task:
            base_parameters: {run_id: "{{job.run_id}}"}   # stamped on every row
            notebook_path: ../src/03_postgres_snapshot.py

        - task_key: daily_rollup
          depends_on:
            - task_key: system_tables_rollup
            - task_key: postgres_snapshot
          notebook_task:
            base_parameters: {run_id: "{{job.run_id}}"}   # stamped on every row
            notebook_path: ../src/04_daily_rollup.py

        - task_key: retention
          depends_on:
            - task_key: daily_rollup
          notebook_task:
            base_parameters: {run_id: "{{job.run_id}}"}   # stamped on every row
            notebook_path: ../src/05_retention.py
