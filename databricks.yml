# Lakebase Health Check — Databricks Asset Bundle
# See README.md for what it does and INSTALL.md for installation and troubleshooting.
bundle:
  name: lakebase-health-check
  engine: direct          # required for genie_spaces; default since CLI 1.3.0

include:
  - resources/*.yml
  - local/*.yml        # written by scripts/deploy.sh (git-ignored): variables, run_as, permissions

# Creates the schema, tables and views before resources are deployed, so the Genie space (which
# validates its tables at creation time) works on the first deploy. Needs python3 locally and a
# SQL warehouse (warehouse_id). Idempotent.
experimental:
  scripts:
    predeploy: >-
      python3 scripts/bootstrap_tables.py --catalog ${var.target_catalog_name}
      --schema ${var.target_schema_name} --warehouse ${var.warehouse_id}
      --profile ${workspace.profile}

variables:
  project_id:
    description: "Required. Lakebase project ID (the last part of projects/<project_id>)"
  branch_id:
    description: "Required. Branch ID in that project (the last part of projects/<p>/branches/<branch_id>, e.g. production)"
  target_catalog_name:
    description: Unity Catalog catalog for lb_health_metrics / lb_health_thresholds
    default: main
  target_schema_name:
    description: Schema for the tables and views (created if missing)
    default: lb_health_check
  warehouse_id:
    description: "Required. SQL warehouse for the dashboard, the Genie space and the predeploy bootstrap"
  failure_notification_emails:
    description: Email addresses notified when the job fails (optional)
    type: complex
    default: []
  schedule_pause_status:
    description: "UNPAUSED or PAUSED. The dev target defaults to PAUSED"
    default: UNPAUSED

targets:
  default:                # customer deployment
    default: true
    workspace:
      profile: DEFAULT
    # To run the job as a service principal, use scripts/deploy.sh, or uncomment and set its application ID.
    # run_as is set on the job only: a bundle-level run_as is not allowed with the dashboard's embedded
    # credentials. The SP also needs read access to the deployed files (the permissions entry).
    # resources:
    #   jobs:
    #     lakebase_health:
    #       run_as:
    #         service_principal_name: "<sp-application-id>"
    # permissions:
    #   - service_principal_name: "<sp-application-id>"
    #     level: CAN_VIEW

  dev:                    # test deployment (no `mode: development`, so resources keep their plain names)
    workspace:
      profile: DEFAULT          # placeholder: your dev workspace profile (or pass --profile)
    variables:
      schedule_pause_status: PAUSED   # set UNPAUSED (e.g. in variable-overrides.json) to run dev on schedule
